:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);

}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);

}

  color: var(--muted-foreground);
  background: transparent;

  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {

.form-label {

  margin-bottom: 6px;

  padding: 0 8px;

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {

.form-control:focus-visible {

  background-color: var(--secondary);

}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(

    [type=&quot;datetime-local&quot;],

    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {

  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

    (() =&gt; {
      const root = document.getElementById(&#x27;simpact-climate-room&#x27;);
      const data = JSON.parse(root.querySelector(&#x27;#room-public-data&#x27;).textContent);
      const find = selector =&gt; root.querySelector(selector);
      let round = &#x27;2&#x27;;
      let selected = &#x27;eu&#x27;;
      let view = &#x27;teams&#x27;;
      const money = value =&gt; `${value &gt; 0 ? &#x27;+&#x27; : value &lt; 0 ? &#x27;−&#x27; : &#x27;&#x27;}$${Math.abs(value).toFixed(0)}B`;
      const esc = value =&gt; String(value).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, c =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
      function renderChart() {
        const svg = find(&#x27;#room-trajectory&#x27;);
        const width = Math.max(260, Math.round(svg.getBoundingClientRect().width || 680));
        const height = 172, left = 37, right = 21, top = 21, bottom = 32;
        const series = [data.rounds[&#x27;1&#x27;].trajectory, data.rounds[&#x27;2&#x27;].trajectory];
        const all = series.flat();
        const xmin = Math.min(...all.map(p =&gt; p[0])), xmax = Math.max(...all.map(p =&gt; p[0]));
        const ymin = Math.floor(Math.min(...all.map(p =&gt; p[1])) / 10) * 10;
        const ymax = Math.ceil(Math.max(...all.map(p =&gt; p[1])) / 10) * 10;
        const x = year =&gt; left + (year - xmin) / (xmax - xmin) * (width - left - right);
        const y = value =&gt; top + (ymax - value) / (ymax - ymin) * (height - top - bottom);
        const path = points =&gt; points.map((p,i) =&gt; `${i ? &#x27;L&#x27; : &#x27;M&#x27;}${x(p[0]).toFixed(2)},${y(p[1]).toFixed(2)}`).join(&#x27; &#x27;);
        const tickYears = width &lt; 420 ? [2026,2060,2100] : [2026,2050,2075,2100];
        const labels = tickYears.map(year =&gt; `&lt;text x=&quot;${x(year)}&quot; y=&quot;${height-12}&quot; text-anchor=&quot;${year === xmin ? &#x27;start&#x27; : year === xmax ? &#x27;end&#x27; : &#x27;middle&#x27;}&quot;&gt;${year}&lt;/text&gt;`).join(&#x27;&#x27;);
        const grid = [40,70,100].map(value =&gt; `&lt;path d=&quot;M${left},${y(value)}H${width-right}&quot; stroke=&quot;var(--room-line)&quot; fill=&quot;none&quot;/&gt;&lt;text x=&quot;${left-9}&quot; y=&quot;${y(value)+4}&quot; text-anchor=&quot;end&quot;&gt;${value}&lt;/text&gt;`).join(&#x27;&#x27;);
        svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);
        svg.innerHTML = `&lt;title&gt;Mock global emissions index, 2026–2100&lt;/title&gt;&lt;desc&gt;Scripted run. Initial emissions index ends at 38.65; final at 32.61. Not a scientific forecast.&lt;/desc&gt;${grid}${labels}&lt;path class=&quot;room-chart-initial&quot; d=&quot;${path(series[0])}&quot; fill=&quot;none&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;5 5&quot;/&gt;${round === &#x27;2&#x27; ? `&lt;path class=&quot;room-chart-final&quot; d=&quot;${path(series[1])}&quot; fill=&quot;none&quot; stroke-width=&quot;2.5&quot;/&gt;` : &#x27;&#x27;}`;
        find(&#x27;#room-final-legend&#x27;).hidden = round !== &#x27;2&#x27;;
      }
      function render() {
        const current = data.rounds[round];
        const values = Object.values(current.commitments);
        const contribution = values.reduce((sum,c) =&gt; sum + Math.max(0,c[5]),0);
        const requested = values.reduce((sum,c) =&gt; sum + Math.max(0,-c[5]),0);
        find(&#x27;#room-warming&#x27;).innerHTML = `${current.warming.toFixed(2)}&lt;small&gt; °C&lt;/small&gt;`;
        find(&#x27;#room-fund&#x27;).innerHTML = `$${contribution}&lt;small&gt; B/yr&lt;/small&gt;`;
        find(&#x27;#room-requests&#x27;).innerHTML = `$${requested}&lt;small&gt; B/yr&lt;/small&gt;`;
        find(&#x27;#room-gap&#x27;).textContent = `$${Math.max(0,requested-contribution)}B annual funding gap`;
        root.querySelectorAll(&#x27;[data-round]&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.round === round)));
        root.querySelectorAll(&#x27;[data-view]&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.view === view)));
        [&#x27;teams&#x27;,&#x27;summit&#x27;,&#x27;commitments&#x27;].forEach(name =&gt; find(`#room-view-${name}`).hidden = name !== view);
        find(&#x27;#room-countries&#x27;).innerHTML = data.delegations.map(d =&gt; {
          const c = current.commitments[d.id];
          return `&lt;button type=&quot;button&quot; class=&quot;room-country&quot; data-country=&quot;${d.id}&quot; aria-pressed=&quot;${selected === d.id}&quot; aria-label=&quot;Select ${esc(d.name)}&quot;&gt;&lt;span class=&quot;room-country-top&quot;&gt;&lt;span class=&quot;room-country-code&quot;&gt;${d.code}&lt;/span&gt;&lt;span class=&quot;room-check&quot;&gt;✓ Submitted&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;room-country-name&quot;&gt;${esc(d.name)}&lt;/span&gt;&lt;span class=&quot;room-country-metric&quot;&gt;${c[2].toFixed(2)}% &lt;small&gt;cuts / year&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;room-country-bottom&quot;&gt;&lt;span class=&quot;room-avatars&quot; aria-hidden=&quot;true&quot;&gt;&lt;span class=&quot;room-avatar&quot;&gt;H&lt;/span&gt;&lt;span class=&quot;room-avatar&quot;&gt;E&lt;/span&gt;&lt;span class=&quot;room-avatar&quot;&gt;C&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;room-finance&quot;&gt;${money(c[5])} / yr&lt;/span&gt;&lt;/span&gt;&lt;/button&gt;`;
        }).join(&#x27;&#x27;);
        const delegation = data.delegations.find(d =&gt; d.id === selected);
        const c = current.commitments[selected];
        find(&#x27;#room-team-title&#x27;).textContent = delegation.name;
        find(&#x27;#room-policy-round&#x27;).textContent = round === &#x27;1&#x27; ? &#x27;Initial · R1&#x27; : &#x27;Final · R2&#x27;;
        const policy = [[&#x27;Emissions peak&#x27;,c[0]],[&#x27;Reductions begin&#x27;,c[1]],[&#x27;Annual reduction&#x27;,`${c[2].toFixed(2)}%`],[&#x27;Deforestation prevention&#x27;,`${c[3]}%`],[&#x27;Afforestation effort&#x27;,`${c[4]}%`],[&#x27;Climate fund&#x27;,`${money(c[5])} / yr`]];
        find(&#x27;#room-policy&#x27;).innerHTML = policy.map(([label,value]) =&gt; `&lt;dt&gt;${label}&lt;/dt&gt;&lt;dd&gt;${value}&lt;/dd&gt;`).join(&#x27;&#x27;);
        find(&#x27;#room-messages&#x27;).innerHTML = data.delegations.map(d =&gt; `&lt;article class=&quot;room-message&quot;&gt;&lt;span class=&quot;room-message-code&quot;&gt;${d.code}&lt;/span&gt;&lt;div class=&quot;room-message-content&quot;&gt;&lt;strong&gt;${esc(d.name)}&lt;/strong&gt;&lt;span class=&quot;room-label&quot; style=&quot;margin-left:8px&quot;&gt;spokesperson&lt;/span&gt;&lt;p&gt;${esc(current.statements[d.id])}&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;`).join(&#x27;&#x27;);
        find(&#x27;#room-commitment-rows&#x27;).innerHTML = data.delegations.map(d =&gt; {
          const c = current.commitments[d.id];
          return `&lt;tr class=&quot;${d.id === selected ? &#x27;room-selected&#x27; : &#x27;&#x27;}&quot;&gt;&lt;td&gt;${esc(d.name)}&lt;/td&gt;&lt;td&gt;${c[0]}&lt;/td&gt;&lt;td&gt;${c[1]}&lt;/td&gt;&lt;td&gt;${c[2].toFixed(2)}&lt;/td&gt;&lt;td&gt;${c[3]}&lt;/td&gt;&lt;td&gt;${c[4]}&lt;/td&gt;&lt;td&gt;${c[5] &gt; 0 ? &#x27;+&#x27; : &#x27;&#x27;}${c[5]}&lt;/td&gt;&lt;/tr&gt;`;
        }).join(&#x27;&#x27;);
        renderChart();
      }
      root.addEventListener(&#x27;click&#x27;, event =&gt; {
        const button = event.target.closest(&#x27;button&#x27;);
        if (!button || !root.contains(button)) return;
        if (button.dataset.round) round = button.dataset.round;
        if (button.dataset.country) selected = button.dataset.country;
        if (button.dataset.view) view = button.dataset.view;
        render();
      });
      render();
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) new ResizeObserver(renderChart).observe(find(&#x27;#room-trajectory&#x27;));
    })();
  &lt;/script&gt;
