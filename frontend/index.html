<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Round 1 · simpact</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="masthead"><a class="wordmark" href="/" aria-label="simpact home">simpact<span aria-hidden="true">.</span></a><span class="round-label">ROUND 01</span></header>
  <main id="main">
    <section id="country-view" aria-labelledby="round-title">
      <div class="intro"><p class="eyebrow">THE FIRST CONVERSATION</p><h1 id="round-title">Round 1</h1><p class="lead">Every country starts with a conversation.<br>Choose a delegation to listen in.</p><p class="roster-total" id="roster-total" aria-live="polite">Loading delegations…</p></div>
      <div id="countries" class="country-grid" aria-label="Countries"></div>
    </section>
    <section id="discussion-view" aria-labelledby="country-title" hidden>
      <button id="back-to-countries" class="back-button" type="button"><span aria-hidden="true">←</span> All countries</button>
      <div class="country-heading"><p class="eyebrow">ROUND 1 · DELEGATION DISCUSSION</p><h1 id="country-title" tabindex="-1"></h1><p class="lead" id="country-description"></p></div>
      <div id="agents" class="agent-strip" aria-label="Delegation agents"></div>
      <div id="live-controls" class="live-controls" hidden><div><p id="live-status" role="status"></p><small id="live-budget"></small></div><button id="conversation-control" type="button">Start conversation</button></div>
      <div class="conversation-heading"><h2>The conversation</h2><span id="message-count"></span></div>
      <div id="discussion" class="conversation" aria-label="Round 1 discussion"></div>
    </section>
    <div id="error" class="error-message" role="alert" hidden><p id="error-text"></p><button id="retry" type="button">Try again</button></div>
  </main>
  <footer class="page-footer"><span id="run-caption">Recorded discussion</span><span>Round 1</span></footer>
  <dialog id="agent-dialog" aria-labelledby="agent-title">
    <div class="dialog-heading"><div><p class="eyebrow" id="agent-country"></p><h2 id="agent-title"></h2></div><button id="close-agent" class="close-button" type="button" aria-label="Close agent details">×</button></div>
    <div id="agent-details" class="agent-details" aria-live="polite"></div>
  </dialog>
</body>
</html>
